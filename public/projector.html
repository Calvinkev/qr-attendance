<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projector Mode — QR Attendance</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0a0c; --surface:#111114; --accent:#7c6bf5; --accent2:#a78bfa; --green:#34d399; --text:#eeedf5; --muted:#5e5d6e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; overflow:hidden; }
  .left { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px;
    background: radial-gradient(ellipse at center, rgba(124,107,245,0.06) 0%, transparent 70%); }
  .right { width:320px; background:var(--surface); border-left:1px solid #26262e; display:flex; flex-direction:column; }
  .qr-box { background:#fff; padding:24px; border-radius:20px; box-shadow:0 0 60px rgba(124,107,245,0.15); margin-bottom:24px; }
  .qr-box img { width:280px; height:280px; display:block; }
  .session-title { font-size:24px; font-weight:700; text-align:center; margin-bottom:8px; }
  .session-timer { font-size:16px; color:var(--muted); text-align:center; font-variant-numeric:tabular-nums; }
  .session-timer .live { color:var(--green); }
  .rotate-hint { font-size:12px; color:var(--muted); text-align:center; margin-top:12px; opacity:0.6; }
  .counter { padding:20px; text-align:center; border-bottom:1px solid #26262e; }
  .counter-num { font-size:56px; font-weight:800; color:var(--accent2); }
  .counter-label { font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
  .feed { flex:1; overflow-y:auto; padding:12px; }
  .feed::-webkit-scrollbar { width:3px; } .feed::-webkit-scrollbar-thumb { background:#26262e; border-radius:3px; }
  .feed-item { padding:10px 12px; border-bottom:1px solid #1a1a1f; animation:slideIn .3s ease; }
  .feed-name { font-size:14px; font-weight:500; }
  .feed-reg { font-size:12px; color:var(--muted); }
  .feed-time { font-size:11px; color:var(--muted); float:right; margin-top:2px; }
  .empty { color:var(--muted); text-align:center; padding:40px 12px; font-size:13px; }
  .controls { padding:12px; border-top:1px solid #26262e; display:flex; gap:8px; }
  .controls button { flex:1; padding:10px; border:1px solid #26262e; background:var(--bg); color:var(--text);
    border-radius:8px; cursor:pointer; font-family:inherit; font-size:12px; transition:all .2s; }
  .controls button:hover { border-color:var(--accent); }
  @keyframes slideIn { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:translateX(0); } }
  @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.02); } }
  .qr-box.rotating { animation: pulse 0.5s ease; }
  .fullscreen-hint { position:fixed; bottom:12px; left:12px; font-size:11px; color:var(--muted); opacity:0.5; }
</style>
</head>
<body>

<div class="left">
  <div class="session-title" id="title">Loading…</div>
  <div class="session-timer" id="timer"></div>
  <div style="height:24px"></div>
  <div class="qr-box" id="qrBox">
    <img id="qrImg" src="" alt="QR Code">
  </div>
  <div class="rotate-hint">QR refreshes every 30 seconds — screenshots won't work</div>
</div>

<div class="right">
  <div class="counter">
    <div class="counter-num" id="count">0</div>
    <div class="counter-label">Checked In</div>
  </div>
  <div class="feed" id="feed">
    <div class="empty">Waiting for check-ins…</div>
  </div>
  <div class="controls">
    <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
    <button onclick="window.close()">✕ Exit</button>
  </div>
</div>

<div class="fullscreen-hint">Press F11 or click Fullscreen for best experience</div>

<!-- Notification sound (short chime via Web Audio API) -->
<script>
const params = new URLSearchParams(window.location.search);
const sessionId = params.get('id');
let qrInterval = null;
let sseSource = null;
let audioCtx = null;

// Chime sound
function playChime() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    osc.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
  } catch(e) {}
}

async function init() {
  if (!sessionId) { document.getElementById('title').textContent = 'No session ID'; return; }

  const res = await fetch('/api/sessions/' + sessionId);
  const session = await res.json();
  document.getElementById('title').textContent = session.title;
  document.getElementById('count').textContent = session.attendance.length;

  renderFeed(session.attendance);
  startTimer(session.expiresAt);
  rotateQR();
  qrInterval = setInterval(rotateQR, 30000);

  // SSE
  sseSource = new EventSource('/api/sessions/' + sessionId + '/stream');
  sseSource.addEventListener('checkin', e => {
    const d = JSON.parse(e.data);
    document.getElementById('count').textContent = d.count;
    addFeedItem(d);
    playChime();
  });
}

async function rotateQR() {
  const res = await fetch('/api/sessions/' + sessionId + '/qr');
  const data = await res.json();
  const img = document.getElementById('qrImg');
  img.src = data.qrDataUrl;
  const box = document.getElementById('qrBox');
  box.classList.remove('rotating');
  void box.offsetWidth;
  box.classList.add('rotating');
}

function startTimer(expiresAt) {
  function tick() {
    const rem = expiresAt - Date.now();
    const el = document.getElementById('timer');
    if (rem <= 0) { el.innerHTML = '<span style="color:#f87171">● Session Closed</span>'; return; }
    const m = Math.floor(rem / 60000);
    const s = Math.floor((rem % 60000) / 1000);
    el.innerHTML = `<span class="live">● LIVE</span>  —  ${m}m ${s < 10 ? '0' : ''}${s}s remaining`;
  }
  tick();
  setInterval(tick, 1000);
}

function renderFeed(attendance) {
  const feed = document.getElementById('feed');
  if (!attendance.length) { feed.innerHTML = '<div class="empty">Waiting for check-ins…</div>'; return; }
  feed.innerHTML = attendance.slice().reverse().map(a => `
    <div class="feed-item">
      <span class="feed-time">${new Date(a.timestamp).toLocaleTimeString()}</span>
      <div class="feed-name">${esc(a.name)}</div>
      <div class="feed-reg">${esc(a.regNumber)}</div>
    </div>`).join('');
}

function addFeedItem(d) {
  const feed = document.getElementById('feed');
  if (feed.querySelector('.empty')) feed.innerHTML = '';
  feed.insertAdjacentHTML('afterbegin', `
    <div class="feed-item">
      <span class="feed-time">${new Date(d.timestamp).toLocaleTimeString()}</span>
      <div class="feed-name">${esc(d.name)}</div>
      <div class="feed-reg">${esc(d.regNumber)}</div>
    </div>`);
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

function esc(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

init();
</script>
</body>
</html>
