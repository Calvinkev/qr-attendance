<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check In — QR Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="checkin-body">

<div class="checkin-card">
  <div class="checkin-icon" id="icon">✅</div>
  <h1 id="heading">Session Check-In</h1>
  <div class="checkin-session" id="sessionTitle">Loading session…</div>
  <div class="checkin-timer" id="timerText"></div>

  <form id="form">
    <label for="name">Full Name</label>
    <input id="name" placeholder="e.g. Calvin Bukenya" required autocomplete="name">
    <label for="regNumber">Registration Number</label>
    <input id="regNumber" placeholder="e.g. 2024/BSE/049/PS" required autocomplete="off">
    <button type="submit" id="submitBtn" class="checkin-btn">Mark Me Present</button>
  </form>

  <div class="checkin-msg" id="msg"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const sessionId = params.get('id');
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const submitBtn = document.getElementById('submitBtn');
const sessionTitleEl = document.getElementById('sessionTitle');
const timerEl = document.getElementById('timerText');
let sessionExpiresAt = null;
let timerInterval = null;

async function loadSession() {
  if (!sessionId) {
    sessionTitleEl.textContent = 'No session specified.';
    form.style.display = 'none';
    document.getElementById('icon').textContent = '❌';
    return;
  }
  try {
    const res = await fetch('/api/sessions/' + sessionId);
    const data = await res.json();
    if (!res.ok) {
      sessionTitleEl.textContent = 'Session not found.';
      form.style.display = 'none';
      document.getElementById('icon').textContent = '❌';
      return;
    }
    sessionTitleEl.textContent = data.title;
    sessionExpiresAt = data.expiresAt;

    if (Date.now() > data.expiresAt) {
      form.style.display = 'none';
      document.getElementById('icon').textContent = '⏰';
      document.getElementById('heading').textContent = 'Session Closed';
      msg.className = 'checkin-msg error';
      msg.textContent = 'This attendance session has ended. Contact your instructor if you need help.';
      timerEl.textContent = 'Expired';
      return;
    }

    startTimer();

    // Restore name/reg from localStorage for returning students
    const savedName = localStorage.getItem('qr_att_name');
    const savedReg = localStorage.getItem('qr_att_reg');
    if (savedName) document.getElementById('name').value = savedName;
    if (savedReg) document.getElementById('regNumber').value = savedReg;
  } catch {
    sessionTitleEl.textContent = 'Could not connect to server.';
    form.style.display = 'none';
    document.getElementById('icon').textContent = '🔌';
  }
}

function startTimer() {
  function tick() {
    const remaining = sessionExpiresAt - Date.now();
    if (remaining <= 0) {
      timerEl.textContent = 'Session just closed';
      timerEl.style.color = 'var(--red)';
      clearInterval(timerInterval);
      return;
    }
    const m = Math.floor(remaining / 60000);
    const s = Math.floor((remaining % 60000) / 1000);
    timerEl.textContent = `${m}m ${s < 10 ? '0' : ''}${s}s remaining to check in`;
  }
  tick();
  timerInterval = setInterval(tick, 1000);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  submitBtn.textContent = 'Submitting…';
  msg.className = 'checkin-msg';
  msg.textContent = '';

  const name = document.getElementById('name').value.trim();
  const regNumber = document.getElementById('regNumber').value.trim();

  // Save for next time
  localStorage.setItem('qr_att_name', name);
  localStorage.setItem('qr_att_reg', regNumber);

  try {
    const res = await fetch('/api/checkin/' + sessionId, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, regNumber })
    });
    const data = await res.json();
    if (res.ok) {
      msg.className = 'checkin-msg success';
      msg.textContent = data.message;
      form.style.display = 'none';
      document.getElementById('icon').textContent = '🎉';
      document.getElementById('heading').textContent = 'You\'re In!';
    } else {
      msg.className = 'checkin-msg error';
      msg.textContent = data.error || 'Something went wrong.';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Mark Me Present';
    }
  } catch {
    msg.className = 'checkin-msg error';
    msg.textContent = 'Network error. Check your connection and try again.';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Mark Me Present';
  }
});

loadSession();
</script>
</body>
</html>
