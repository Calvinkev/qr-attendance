<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check In</title>
<style>
  :root {
    --bg: #0d0d0f;
    --panel: #17171a;
    --border: #2a2a2e;
    --gold: #c9a24b;
    --text: #eee8dd;
    --muted: #9a948a;
    --green: #4caf7d;
    --red: #d16a6a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .icon { font-size: 40px; margin-bottom: 8px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .session-title { color: var(--gold); font-size: 15px; margin-bottom: 20px; }
  label { display: block; text-align: left; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input {
    width: 100%;
    background: #0d0d0f;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 14px;
  }
  input:focus { outline: none; border-color: var(--gold); }
  button {
    width: 100%;
    background: var(--gold);
    color: #1a1a1a;
    border: none;
    padding: 13px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; }
  .msg { margin-top: 16px; font-size: 14px; padding: 10px; border-radius: 8px; display: none; }
  .msg.success { background: rgba(76,175,125,0.12); color: var(--green); display: block; }
  .msg.error { background: rgba(209,106,106,0.12); color: var(--red); display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="icon" id="icon">✅</div>
  <h1 id="heading">Session Check-In</h1>
  <div class="session-title" id="sessionTitle">Loading session…</div>

  <form id="form">
    <label>Full Name</label>
    <input id="name" placeholder="e.g. Calvin Bukenya" required />
    <label>Registration Number</label>
    <input id="regNumber" placeholder="e.g. 2024/BSE/049/PS" required />
    <button type="submit" id="submitBtn">Mark Me Present</button>
  </form>

  <div class="msg" id="msg"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const sessionId = params.get('id');
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const submitBtn = document.getElementById('submitBtn');
const sessionTitleEl = document.getElementById('sessionTitle');

async function loadSession() {
  if (!sessionId) {
    sessionTitleEl.textContent = 'No session specified.';
    form.style.display = 'none';
    return;
  }
  const res = await fetch('/api/sessions/' + sessionId);
  const data = await res.json();
  if (!res.ok) {
    sessionTitleEl.textContent = 'Session not found.';
    form.style.display = 'none';
    return;
  }
  sessionTitleEl.textContent = data.title;
  if (Date.now() > data.expiresAt) {
    form.style.display = 'none';
    msg.className = 'msg error';
    msg.textContent = 'This attendance session has closed.';
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  submitBtn.textContent = 'Submitting…';
  msg.className = 'msg';
  msg.textContent = '';

  const name = document.getElementById('name').value.trim();
  const regNumber = document.getElementById('regNumber').value.trim();

  try {
    const res = await fetch('/api/checkin/' + sessionId, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, regNumber })
    });
    const data = await res.json();
    if (res.ok) {
      msg.className = 'msg success';
      msg.textContent = data.message;
      form.style.display = 'none';
      document.getElementById('icon').textContent = '🎉';
    } else {
      msg.className = 'msg error';
      msg.textContent = data.error || 'Something went wrong.';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Mark Me Present';
    }
  } catch (err) {
    msg.className = 'msg error';
    msg.textContent = 'Network error. Please try again.';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Mark Me Present';
  }
});

loadSession();
</script>
</body>
</html>
