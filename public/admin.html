<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Admin</title>
<style>
  :root {
    --bg: #0d0d0f;
    --panel: #17171a;
    --border: #2a2a2e;
    --gold: #c9a24b;
    --text: #eee8dd;
    --muted: #9a948a;
    --green: #4caf7d;
    --red: #d16a6a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    letter-spacing: 0.5px;
  }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .container { max-width: 480px; margin: 0 auto; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: var(--gold); font-weight: 600; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  input {
    width: 100%;
    background: #0d0d0f;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  input:focus { outline: none; border-color: var(--gold); }
  button {
    width: 100%;
    background: var(--gold);
    color: #1a1a1a;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    margin-top: 8px;
  }
  .qr-wrap { text-align: center; margin: 14px 0; }
  .qr-wrap img { width: 220px; height: 220px; border-radius: 10px; background: #fff; padding: 10px; }
  .link-box {
    font-size: 11px;
    color: var(--muted);
    word-break: break-all;
    background: #0d0d0f;
    padding: 8px;
    border-radius: 6px;
    margin-top: 8px;
  }
  .stat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .stat-count { font-size: 28px; color: var(--gold); font-weight: 700; }
  .stat-label { font-size: 12px; color: var(--muted); }
  ul.attendees { list-style: none; padding: 0; margin: 10px 0 0; max-height: 260px; overflow-y: auto; }
  ul.attendees li {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  ul.attendees li:last-child { border-bottom: none; }
  ul.attendees .time { color: var(--muted); font-size: 11px; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 12px; }
  .session-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .session-item:last-child { border-bottom: none; }
  .session-title { font-size: 13px; }
  .session-meta { font-size: 11px; color: var(--muted); }
  .badge {
    background: rgba(201,162,75,0.15);
    color: var(--gold);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
  }
  .status-live { color: var(--green); }
  .status-closed { color: var(--red); }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    border: 1px solid var(--gold);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }
</style>
</head>
<body>
<div class="container">
  <h1>📋 Attendance Admin</h1>
  <div class="sub">Create a session, share the QR, watch check-ins live.</div>

  <div class="card" id="createCard">
    <h2>New Session</h2>
    <label>Session title</label>
    <input id="title" placeholder="e.g. SENG 421 - Week 6" />
    <label>Active for (minutes)</label>
    <input id="duration" type="number" value="120" />
    <button onclick="createSession()">Generate QR Code</button>
  </div>

  <div class="card" id="activeCard" style="display:none;">
    <h2 id="activeTitle">Session</h2>
    <div class="qr-wrap">
      <img id="qrImg" src="" alt="QR code" />
    </div>
    <div class="link-box" id="linkBox"></div>
    <button class="secondary" onclick="exportCsv()">⬇ Export CSV</button>
    <button class="secondary" onclick="goHome()">+ New Session</button>

    <div style="margin-top:18px;">
      <div class="stat-row">
        <div>
          <div class="stat-count" id="countNum">0</div>
          <div class="stat-label">checked in</div>
        </div>
        <div class="badge" id="statusBadge">live</div>
      </div>
      <ul class="attendees" id="attendeeList"></ul>
    </div>
  </div>

  <div class="card" id="historyCard">
    <h2>Past Sessions</h2>
    <div id="historyList"><div class="empty">Loading…</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let currentId = null;
let pollTimer = null;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

async function createSession() {
  const title = document.getElementById('title').value.trim();
  const duration = document.getElementById('duration').value;
  if (!title) { showToast('Enter a session title'); return; }

  const res = await fetch('/api/sessions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, durationMinutes: duration })
  });
  const data = await res.json();
  if (!res.ok) { showToast(data.error || 'Failed to create session'); return; }

  openSession(data.id, data.title, data.qrDataUrl, data.checkinUrl, data.expiresAt);
  loadHistory();
}

function openSession(id, title, qrDataUrl, checkinUrl, expiresAt) {
  currentId = id;
  document.getElementById('createCard').style.display = 'none';
  document.getElementById('activeCard').style.display = 'block';
  document.getElementById('activeTitle').textContent = title;
  document.getElementById('qrImg').src = qrDataUrl;
  document.getElementById('linkBox').textContent = checkinUrl;
  refreshAttendance();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(refreshAttendance, 4000);
}

async function refreshAttendance() {
  if (!currentId) return;
  const res = await fetch('/api/sessions/' + currentId);
  const session = await res.json();
  if (!res.ok) return;

  document.getElementById('countNum').textContent = session.attendance.length;
  const badge = document.getElementById('statusBadge');
  const isLive = Date.now() < session.expiresAt;
  badge.textContent = isLive ? 'live' : 'closed';
  badge.className = 'badge ' + (isLive ? 'status-live' : 'status-closed');

  const list = document.getElementById('attendeeList');
  if (session.attendance.length === 0) {
    list.innerHTML = '<div class="empty">No check-ins yet</div>';
  } else {
    list.innerHTML = session.attendance
      .slice()
      .reverse()
      .map(a => `<li><span>${escapeHtml(a.name)} · ${escapeHtml(a.regNumber)}</span><span class="time">${new Date(a.timestamp).toLocaleTimeString()}</span></li>`)
      .join('');
  }
}

function exportCsv() {
  if (!currentId) return;
  window.location.href = '/api/sessions/' + currentId + '/export';
}

function goHome() {
  currentId = null;
  if (pollTimer) clearInterval(pollTimer);
  document.getElementById('createCard').style.display = 'block';
  document.getElementById('activeCard').style.display = 'none';
  document.getElementById('title').value = '';
}

async function loadHistory() {
  const res = await fetch('/api/sessions');
  const sessions = await res.json();
  const el = document.getElementById('historyList');
  if (sessions.length === 0) {
    el.innerHTML = '<div class="empty">No sessions yet</div>';
    return;
  }
  el.innerHTML = sessions.map(s => `
    <div class="session-item" onclick="loadSessionQr('${s.id}', '${escapeHtml(s.title)}')">
      <div>
        <div class="session-title">${escapeHtml(s.title)}</div>
        <div class="session-meta">${new Date(s.createdAt).toLocaleString()} · ${s.count} checked in</div>
      </div>
      <div class="badge ${Date.now() < s.expiresAt ? 'status-live' : 'status-closed'}">${Date.now() < s.expiresAt ? 'live' : 'closed'}</div>
    </div>
  `).join('');
}

async function loadSessionQr(id, title) {
  const res = await fetch('/api/sessions/' + id + '/qr');
  const data = await res.json();
  if (!res.ok) { showToast('Could not load session'); return; }
  const sres = await fetch('/api/sessions/' + id);
  const session = await sres.json();
  openSession(id, title, data.qrDataUrl, data.checkinUrl, session.expiresAt);
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

loadHistory();
</script>
</body>
</html>
